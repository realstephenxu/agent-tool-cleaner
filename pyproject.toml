[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-tool-cleaner"
version = "0.1.0"
description = "Scan and uninstall AI agent tools, with optional residue cleanup"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}

[project.scripts]
agent-tool-cleaner = "agent_tool_cleaner:main"

[tool.setuptools]
py-modules = ["agent_tool_cleaner"]
